{% extends "base.html" %}

{% block content %}
<div class="bg-[#F9F5F0] border border-stone-200 rounded-xl shadow-sm mx-6 my-6 p-6 max-w-4xl">
  <div class="flex items-center justify-between mb-6">
    <h2 class="text-xl font-bold text-stone-900">Nuevo pedido</h2>
    <a href="{{ url_for('pedidos.listar') }}" class="text-sm text-stone-500 hover:text-stone-800">
      ← Volver al historial
    </a>
  </div>

  <form method="POST" action="{{ url_for('pedidos.nuevo') }}" id="form-pedido">
    <!-- Fila 1: Cliente y Vendedor -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
      <div>
        <label class="block text-xs font-semibold text-stone-700 mb-1">Cliente</label>
        <select name="id_cliente" required
                class="w-full bg-white border border-stone-300 rounded-lg px-3 py-2 text-sm">
          <option value="" disabled selected>Elige un cliente</option>
          {% for c in clientes %}
          <option value="{{ c.id_cliente }}">{{ c.nombre_cliente }} {{ c.apellido_cliente }}</option>
          {% endfor %}
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold text-stone-700 mb-1">Vendedor</label>
        <select name="id_vendedor" required
                class="w-full bg-white border border-stone-300 rounded-lg px-3 py-2 text-sm">
          <option value="" disabled selected>Elige un vendedor</option>
          {% for v in vendedores %}
          <option value="{{ v.id_vendedor }}">{{ v.nombre_vendedor }} {{ v.apellido_vendedor }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <!-- Fila 2: Selector de producto + Cantidad + Botón Agregar -->
    <div class="grid grid-cols-1 md:grid-cols-12 gap-3 items-end mb-6">
      <div class="md:col-span-6">
        <label class="block text-xs font-semibold text-stone-700 mb-1">Producto</label>
        <select id="select-producto" class="w-full bg-white border border-stone-300 rounded-lg px-3 py-2 text-sm">
          <option value="" disabled selected>Elige un producto</option>
          {% for prod in productos %}
          <option value="{{ prod.id_producto }}"
                  data-nombre="{{ prod.nombre_producto }}"
                  data-precio="{{ prod.precio_venta }}">
            {{ prod.nombre_producto }} ($ {{ "{:,.0f}".format(prod.precio_venta).replace(",", ".") }})
          </option>
          {% endfor %}
        </select>
      </div>

      <div class="md:col-span-3">
        <label class="block text-xs font-semibold text-stone-700 mb-1">Cantidad</label>
        <input type="number" id="input-cantidad" min="1" value="1"
               class="w-full bg-white border border-stone-300 rounded-lg px-3 py-2 text-sm">
      </div>

      <div class="md:col-span-3">
        <button type="button" id="btn-agregar"
                class="w-full bg-white hover:bg-stone-100 border border-stone-300 text-stone-800 font-semibold py-2 px-4 rounded-lg text-sm">
          Agregar producto
        </button>
      </div>
    </div>

    <!-- Tabla dinámica: Productos del pedido -->
    <div class="bg-white rounded-xl border border-stone-200 p-4 mb-6">
      <h3 class="text-sm font-bold text-stone-800 mb-3">Productos del pedido</h3>
      <table class="w-full text-left text-sm">
        <thead>
          <tr class="border-b border-stone-200 text-stone-400 font-medium">
            <th class="py-2">Producto</th>
            <th class="py-2">Cantidad</th>
            <th class="py-2">Precio unitario</th>
            <th class="py-2">Subtotal</th>
            <th class="py-2 text-right"></th>
          </tr>
        </thead>
        <tbody id="tabla-detalle" class="divide-y divide-stone-100">
          <!-- Se llena dinámicamente con JS -->
        </tbody>
      </table>
      <p id="mensaje-vacio" class="text-xs text-stone-400 text-center py-4">
        Aún no has agregado productos al pedido.
      </p>
    </div>

    <!-- Pie del formulario: Total y Guardar pedido -->
    <div class="flex items-center justify-between pt-2">
      <div class="text-lg font-bold text-stone-900">
        Total <span id="total-pedido" class="ml-2">$ 0</span>
      </div>
      <button type="submit"
              class="bg-[#2C1A12] hover:bg-[#1e110c] text-white font-semibold px-6 py-2.5 rounded-lg text-sm">
        Guardar pedido
      </button>
    </div>
  </form>
</div>

<script>
  const selectProd = document.getElementById("select-producto");
  const inputCant = document.getElementById("input-cantidad");
  const btnAgregar = document.getElementById("btn-agregar");
  const tablaDetalle = document.getElementById("tabla-detalle");
  const msgVacio = document.getElementById("mensaje-vacio");
  const totalSpan = document.getElementById("total-pedido");

  function formatoCOP(valor) {
    return "$ " + Math.round(valor).toLocaleString("es-CO");
  }

  function recalcularTotal() {
    let total = 0;
    document.querySelectorAll(".fila-item").forEach(fila => {
      total += parseFloat(fila.dataset.subtotal);
    });
    totalSpan.textContent = formatoCOP(total);
    msgVacio.style.display = document.querySelectorAll(".fila-item").length ? "none" : "block";
  }

  btnAgregar.addEventListener("click", () => {
    const opcion = selectProd.options[selectProd.selectedIndex];
    if (!opcion || !opcion.value) return;

    const idProd = opcion.value;
    const nombre = opcion.dataset.nombre;
    const precio = parseFloat(opcion.dataset.precio);
    const cantidad = parseInt(inputCant.value, 10);
    if (isNaN(cantidad) || cantidad <= 0) return;

    const subtotal = precio * cantidad;

    const tr = document.createElement("tr");
    tr.className = "fila-item";
    tr.dataset.subtotal = subtotal;
    tr.innerHTML = `
      <td class="py-3 font-medium text-stone-800">
        ${nombre}
        <input type="hidden" name="producto_id[]" value="${idProd}">
        <input type="hidden" name="cantidad[]" value="${cantidad}">
        <input type="hidden" name="precio_unitario[]" value="${precio}">
      </td>
      <td class="py-3">${cantidad}</td>
      <td class="py-3">${formatoCOP(precio)}</td>
      <td class="py-3 font-semibold">${formatoCOP(subtotal)}</td>
      <td class="py-3 text-right">
        <button type="button" class="btn-quitar border border-stone-300 hover:bg-red-50 text-stone-600 px-2.5 py-1 rounded text-xs">
          Quitar
        </button>
      </td>
    `;

    tr.querySelector(".btn-quitar").addEventListener("click", () => {
      tr.remove();
      recalcularTotal();
    });

    tablaDetalle.appendChild(tr);
    recalcularTotal();
    selectProd.selectedIndex = 0;
    inputCant.value = 1;
  });

  // Evita enviar el pedido vacío
  document.getElementById("form-pedido").addEventListener("submit", (e) => {
    if (document.querySelectorAll(".fila-item").length === 0) {
      e.preventDefault();
      alert("Debes agregar al menos un producto al pedido.");
    }
  });
</script>
{% endblock %}
