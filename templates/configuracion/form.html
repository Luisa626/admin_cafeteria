{% extends "base.html" %}
{% import "macros.html" as m %}
{% block title %}{{ titulo }}{% endblock %}
{% block content %}
<div class="card">
  <div class="card-body">
    <form method="POST" novalidate>
      <div class="row g-3">
        
        <div class="col-md-4">
          <label for="sigla" class="form-label">Sigla*</span></label>
          <input type="text"
                 class="form-control text-uppercase"
                 id="sigla"
                 name="sigla"
                 maxlength="5"
                 value="{{ item.sigla if item else '' }}"
                 required>
        </div>

        <div class="col-md-8">
          <label for="descripcion" class="form-label">Descripción*</span></label>
          <input type="text"
                 class="form-control"
                 id="descripcion"
                 name="descripcion"
                 maxlength="50"
                 value="{{ item.descripcion if item else '' }}"
                 required>
          <div class="form-text">Máximo 50 caracteres.</div>
        </div>

      </div>
      {{ m.botones_form(url_for('configuracion.listar')) }}
{% endblock %}
