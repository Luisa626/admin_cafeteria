{% extends "base.html" %}
{% import "macros.html" as m %}
{% block title %}{{ titulo }}{% endblock %}
{% block content %}
<h1 class="h3 mb-3">{{ titulo }}</h1>
<div class="card"><div class="card-body">
  <form method="post" novalidate>
    <div class="row g-4">
      <div class="col-md-5">
        <label for="nombre_producto" class="form-label">Nombre del producto *</label>
        <input type="text" class="form-control" id="nombre_producto" name="nombre_producto"
               maxlength="100" required value="{{ item.nombre_producto or '' }}">
          <div class="form-text">Máximo 100 caracteres.</div>
      </div>
      <div class="col-md-3">
        <label for="precio_venta" class="form-label">Precio de venta (COP) *</label>
        <input type="number" class="form-control" id="precio_venta" name="precio_venta"
               min="0.01" step="0.01" required
               value="{{ item.precio_venta if item.precio_venta is not none }}">
      </div>
      <div class="col-md-4">
        <label for="id_categoria" class="form-label">Categoría *</label>
        <select class="form-select" id="id_categoria" name="id_categoria" required>
          <option value="">Eliga una categoría..</option>
          {% for c in categorias %}
            <option value="{{ c.id_categoria }}"
              {{ 'selected' if item.id_categoria|string == c.id_categoria|string }}>
              {{ c.nombre_categoria }}</option>
          {% endfor %}
        </select>
      </div>    
    </div>
    {{ m.botones_form(url_for('productos.listar')) }}
  </form>
</div></div>
{% endblock %}
