{% extends "base.html" %}
{% import "macros.html" as m %}
{% block title %}{{ titulo }}{% endblock %}
{% block content %}
<h1 class="h3 mb-3">{{ titulo }}</h1>
<div class="card">
  <div class="card-body">
    <form method="POST" novalidate>
      <div class="mb-3">
        <label for="nombre_categoria" class="form-label">Nombre de la categoría*</span></label>
        <input type="text"
                 class="form-control text-uppercase"
               id="nombre_categoria"
               name="nombre_categoria"
               maxlength="50"
               value="{{ item.nombre_categoria if item else '' }}"
               required>
      </div>
            {{ m.botones_form(url_for('configuracion.listar')) }}
    </form>
  </div>
</div>
{% endblock %}
